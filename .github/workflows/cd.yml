name: CD

on:
  push:
    branches: [main, master, feature/notification-gateway]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Verify deploy secrets
        run: |
          missing=0
          if [ -z "${{ secrets.DEPLOY_VM_HOST }}" ]; then
            echo "::error::Falta secret DEPLOY_VM_HOST"
            missing=1
          fi
          if [ -z "${{ secrets.DEPLOY_VM_USER }}" ]; then
            echo "::error::Falta secret DEPLOY_VM_USER"
            missing=1
          fi
          if [ -z "${{ secrets.DEPLOY_VM_SSH_KEY }}" ]; then
            echo "::error::Falta secret DEPLOY_VM_SSH_KEY"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "Secrets configurados."

      - name: Deploy to VM
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_VM_HOST }}
          username: ${{ secrets.DEPLOY_VM_USER }}
          key: ${{ secrets.DEPLOY_VM_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 45m
          script_stop: true
          script: |
            set -euo pipefail
            export GITHUB_USER=crmgg
            export BRANCH=feature/notification-gateway
            export FRONT_BRANCH=feature/notification-gateway
            export CONFIG_SERVER_BRANCH=master
            export TARGET=/opt/uco-parking

            echo "=== CD UCO Parking ==="
            echo "Host: $(hostname) | Target: $TARGET"

            if [[ ! -f "$TARGET/deploy/.env" ]]; then
              echo "ERROR: falta $TARGET/deploy/.env en la VM"
              exit 1
            fi

            mkdir -p "$TARGET"

            pull_or_clone() {
              local dir="$1"
              local repo="$2"
              local branch="$3"
              if [[ -d "$TARGET/$dir/.git" ]]; then
                git -C "$TARGET/$dir" fetch origin
                git -C "$TARGET/$dir" reset --hard "origin/$branch"
              else
                git clone --branch "$branch" --depth 1 \
                  "https://github.com/${GITHUB_USER}/${repo}.git" "$TARGET/$dir"
              fi
            }

            pull_or_clone uco-parking ucoparking-back "$BRANCH"
            pull_or_clone UcoParkingFront ucoParking-front "$FRONT_BRANCH"
            pull_or_clone uco-parking-config-server uco-parking-config-server "$CONFIG_SERVER_BRANCH"

            ENV_BACKUP="$(mktemp)"
            cp "$TARGET/deploy/.env" "$ENV_BACKUP"
            mkdir -p "$TARGET/deploy"
            cp -r "$TARGET/uco-parking/deploy/." "$TARGET/deploy/"
            cp "$ENV_BACKUP" "$TARGET/deploy/.env"
            rm -f "$ENV_BACKUP"
            chmod +x "$TARGET/deploy/deploy.sh" "$TARGET/deploy/scripts/"*.sh 2>/dev/null || true

            cd "$TARGET/deploy"
            sg docker -c "bash deploy.sh"
