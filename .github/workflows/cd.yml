name: CD

on:
  push:
    branches: [main, master, feature/notification-gateway]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VM
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_VM_HOST }}
          username: ${{ secrets.DEPLOY_VM_USER }}
          key: ${{ secrets.DEPLOY_VM_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 45m
          script: |
            set -e
            TARGET=/opt/uco-parking
            cd "$TARGET/deploy"
            test -f .env
            sudo -n docker ps
            sudo -n bash deploy.sh
