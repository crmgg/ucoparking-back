name: CI

on:
  push:
    branches: [main, master, develop, feature/**]
  pull_request:
    branches: [main, master, develop]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: temurin
          cache: maven

      - name: Build backend
        run: |
          chmod +x mvnw
          ./mvnw -B package -DskipTests