name: uco-parking-prod

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: uco-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}
    volumes:
      - sql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -C || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 45s
    restart: unless-stopped
    networks:
      - uco-net

  redis:
    image: redis:7-alpine
    container_name: uco-redis
    restart: unless-stopped
    networks:
      - uco-net

  config-server:
    build:
      context: ../uco-parking-config-server
      dockerfile: Dockerfile
    container_name: uco-config-server
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - uco-net

  backend:
    build:
      context: ../uco-parking
      dockerfile: Dockerfile
    container_name: uco-backend
    environment:
      TZ: America/Bogota
      JAVA_TOOL_OPTIONS: -Duser.timezone=America/Bogota
      DB_HOST: sqlserver
      DB_PORT: "1433"
      DB_NAME: ucoparking
      DB_USERNAME: sa
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      SPRING_CLOUD_CONFIG_IMPORT_CHECK_ENABLED: "false"
      AUTH0_DOMAIN: ${AUTH0_DOMAIN}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE}
      AUTH0_SECURITY_ENABLED: ${AUTH0_SECURITY_ENABLED:-false}
      NOTIFICATION_EMAIL_ENABLED: ${NOTIFICATION_EMAIL_ENABLED:-false}
      NOTIFICATION_FROM_EMAIL: ${NOTIFICATION_FROM_EMAIL:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_started
      config-server:
        condition: service_started
    restart: unless-stopped
    networks:
      - uco-net

  frontend:
    build:
      context: ../UcoParkingFront
      dockerfile: Dockerfile
      args:
        VITE_AUTH0_DOMAIN: ${VITE_AUTH0_DOMAIN}
        VITE_AUTH0_CLIENT_ID: ${VITE_AUTH0_CLIENT_ID}
        VITE_AUTH0_AUDIENCE: ${VITE_AUTH0_AUDIENCE}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    container_name: uco-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - uco-net

  kong:
    image: kong:3.9
    container_name: uco-kong
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    volumes:
      - ./kong/kong.prod.yml:/kong/kong.yml:ro
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - uco-net

  waf:
    image: nginx:1.27-alpine
    container_name: uco-waf
    ports:
      - "8000:80"
    volumes:
      - ./waf/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - kong
      - frontend
    restart: unless-stopped
    networks:
      - uco-net

volumes:
  sql_data:

networks:
  uco-net:
    driver: bridge
