# Perfil local = boton Run de IntelliJ (sin Redis ni Zipkin obligatorios).
spring.application.name=uco-parking

spring.cache.type=simple
management.tracing.enabled=false

spring.datasource.url=jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:14333};databaseName=${DB_NAME:ucoparking};encrypt=false;trustServerCertificate=true
spring.r2dbc.url=r2dbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:14333}/${DB_NAME:ucoparking}

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
