spring.application.name=uco-parking

# Evita que Spring Boot registre solo el auto-config de repos R2DBC (paquete de arranque);
# los repositorios reactivos se habilitan en PersistenceRepositoriesConfiguration.
spring.data.r2dbc.repositories.enabled=false

# JDBC para JPA (convive con R2DBC para acceso reactivo).
# Con R2DBC activo, Boot no crea DataSource autom�ticamente; hay un bean JDBC expl�cito
# en PersistenceRepositoriesConfiguration.
spring.datasource.url=jdbc:sqlserver://localhost:1434;databaseName=ucoparking;encrypt=false;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=Merengon21!
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

spring.r2dbc.url=r2dbc:sqlserver://localhost:1434/ucoparking
spring.r2dbc.username=sa
spring.r2dbc.password=Merengon21!

spring.webflux.base-path=/uco-parking
logging.level.reactor=INFO
logging.level.co.edu.uco=DEBUG
