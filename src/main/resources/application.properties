spring.application.name=uco-parking
spring.config.import=optional:configserver:http://localhost:8888,optional:file:./infisical-secrets.env
spring.cloud.config.name=uco-parking-messages,uco-parking-parameters,uco-parking-notifications
spring.cloud.config.fail-fast=false

# Evita que Spring Boot registre solo el auto-config de repos R2DBC (paquete de arranque);
# los repositorios reactivos se habilitan en PersistenceRepositoriesConfiguration.
spring.data.r2dbc.repositories.enabled=false

# JDBC para JPA (convive con R2DBC para acceso reactivo).
spring.datasource.url=jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1434};databaseName=${DB_NAME:ucoparking};encrypt=false;trustServerCertificate=true
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:Merengon21!}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

spring.r2dbc.url=r2dbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1434}/${DB_NAME:ucoparking}
spring.r2dbc.username=${DB_USERNAME:sa}
spring.r2dbc.password=${DB_PASSWORD:Merengon21!}

spring.webflux.base-path=/uco-parking
logging.level.reactor=INFO
logging.level.co.edu.uco=DEBUG
logging.pattern.level=%5p [traceId=%X{traceId:-} spanId=%X{spanId:-}] %m%n

# OpenAPI / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Redis (cache distribuida del catalogo de parametros)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.cache.type=redis
spring.cache.redis.time-to-live=300000

# Auth0 — activar con AUTH0_SECURITY_ENABLED=true cuando el API exista en Auth0 Dashboard
auth0.domain=${AUTH0_DOMAIN:dev-oh62f3hilgh8p2rj.us.auth0.com}
auth0.audience=${AUTH0_AUDIENCE:https://uco-parking-api}
auth0.security.enabled=${AUTH0_SECURITY_ENABLED:false}
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://${auth0.domain}/

# Actuator + trazas OpenTelemetry (Micrometer bridge)
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=${ZIPKIN_URL:http://localhost:9411/api/v2/spans}

# Notification Gateway - correo (SMTP)
notification.email.enabled=${NOTIFICATION_EMAIL_ENABLED:false}
notification.email.from=${NOTIFICATION_FROM_EMAIL:}
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=${SMTP_HOST:smtp.gmail.com}

# Fallback de plantillas si el config server no esta disponible al arrancar
catalog.notifications.WELCOME_STUDENT.subject=Bienvenido a UCO Parking
catalog.notifications.WELCOME_STUDENT.body=Hola {studentName}, tu cuenta esta lista para reservar parqueadero.
catalog.notifications.RESERVATION_CONFIRMED.subject=Reserva confirmada - UCO Parking
catalog.notifications.RESERVATION_CONFIRMED.body=Hola {studentName}, reservaste el parqueadero {spaceNumber}.
catalog.notifications.RESERVATION_CANCELLED.subject=Reserva cancelada - UCO Parking
catalog.notifications.RESERVATION_CANCELLED.body=Tu reserva del parqueadero {spaceNumber} fue cancelada.
