spring.application.name=uco-parking-test
spring.cache.type=none
auth0.security.enabled=false
management.tracing.enabled=false
spring.cloud.config.enabled=false
spring.config.import=optional:configserver:http://localhost:8888

spring.datasource.url=jdbc:sqlserver://localhost:1434;databaseName=ucoparking;encrypt=false;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=test
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.hibernate.ddl-auto=none

spring.r2dbc.url=r2dbc:sqlserver://localhost:1434/ucoparking
spring.r2dbc.username=sa
spring.r2dbc.password=test

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
